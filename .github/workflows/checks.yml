name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Repository installs must ship current bundles
        run: |
          git ls-files --error-unmatch panel/main.js service/main.js
          git diff --exit-code -- panel/main.js service/main.js
      - run: bun run docs:build
      - name: Installable package
        run: |
          bun run package "$RUNNER_TEMP/codex-package"
          bun tests/package.ts "$RUNNER_TEMP/codex-package"
